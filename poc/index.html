<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeCAD Web Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; height: 100vh; background: #1a1a2e; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }

  /* Left panel — chat + code viewer */
  #panel { width: 400px; display: flex; flex-direction: column; border-right: 1px solid #2a2a4a; }

  /* Chat area */
  #chat-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #5566ff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #2a2a4a; color: #ddd; border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: #3a1a1a; color: #ff6b6b; border-bottom-left-radius: 4px; }

  /* Input bar */
  #input-bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2a4a; }
  #chat-input { flex: 1; background: #0f0f23; color: #e0e0e0; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; outline: none; resize: none; min-height: 42px; max-height: 120px; }
  #chat-input:focus { border-color: #5566ff; }
  #chat-input::placeholder { color: #666; }
  #send-btn { background: #5566ff; color: white; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  #send-btn:hover { background: #4455dd; }
  #send-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

  /* Thinking indicator */
  .thinking { align-self: flex-start; color: #888; font-size: 13px; font-style: italic; padding: 6px 14px; }
  .thinking::after { content: ''; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* Code viewer (collapsible) */
  #code-section { border-top: 1px solid #2a2a4a; }
  #code-toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; cursor: pointer; user-select: none; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  #code-toggle:hover { background: #1f1f3a; }
  #code-toggle .arrow { transition: transform 0.2s; }
  #code-toggle.open .arrow { transform: rotate(90deg); }
  #code-viewer { display: none; max-height: 250px; overflow-y: auto; }
  #code-toggle.open + #code-viewer { display: block; }
  #code-viewer pre { background: #0f0f23; color: #aaa; padding: 10px 12px; font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; margin: 0; }
  #code-actions { display: flex; gap: 6px; padding: 6px 12px; }
  #code-actions button { background: #2a2a4a; color: #bbb; border: none; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #code-actions button:hover { background: #3a3a5a; color: #fff; }

  /* Right — 3D viewer */
  #viewer { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <div id="chat-area"></div>

  <div id="input-bar">
    <textarea id="chat-input" rows="1" placeholder="Describe a 3D model..."></textarea>
    <button id="send-btn">Send</button>
  </div>

  <div id="code-section">
    <div id="code-toggle" onclick="this.classList.toggle('open')">
      <span>source.py</span>
      <span class="arrow">&#9654;</span>
    </div>
    <div id="code-viewer">
      <div id="code-actions">
        <button id="run-btn">Run</button>
      </div>
      <pre id="code-content">import FreeCAD
import Part
doc = FreeCAD.newDocument("Design")
doc.recompute()</pre>
    </div>
  </div>
</div>

<div id="viewer">
  <canvas id="canvas"></canvas>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const canvas = document.getElementById('canvas');
const chatArea = document.getElementById('chat-area');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const runBtn = document.getElementById('run-btn');
const codeContent = document.getElementById('code-content');

let sessionId = null;
let isThinking = false;

// ── Three.js setup ──────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(50, 1, 1, 1000000);
camera.position.set(60, 60, 60);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 80, 60);
scene.add(dirLight);
let grid = new THREE.GridHelper(200, 20, 0x333355, 0x222244);
scene.add(grid);

let currentMesh = null;
const loader = new STLLoader();
const material = new THREE.MeshStandardMaterial({ color: 0x5588cc, metalness: 0.3, roughness: 0.6 });

function fitCamera(mesh) {
  const box = new THREE.Box3().setFromObject(mesh);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 2;
  controls.target.copy(center);
  camera.position.set(center.x + dist, center.y + dist * 0.7, center.z + dist);
  camera.updateProjectionMatrix();
  controls.update();

  // Rescale grid and light to match model size
  scene.remove(grid);
  const gridSize = Math.pow(10, Math.ceil(Math.log10(maxDim * 2)));
  grid = new THREE.GridHelper(gridSize, 20, 0x333355, 0x222244);
  grid.position.copy(new THREE.Vector3(center.x, 0, center.z));
  scene.add(grid);
  dirLight.position.set(center.x + dist, center.y + dist, center.z + dist);
}

function loadSTL(arrayBuffer) {
  const geometry = loader.parse(arrayBuffer);
  geometry.computeVertexNormals();
  if (currentMesh) scene.remove(currentMesh);
  currentMesh = new THREE.Mesh(geometry, material);
  scene.add(currentMesh);
  fitCamera(currentMesh);
}

function clearScene() {
  if (currentMesh) { scene.remove(currentMesh); currentMesh = null; }
}

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height);
  renderer.setPixelRatio(window.devicePixelRatio);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ── Chat helpers ────────────────────────────────────────────────
function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function setThinking(on) {
  isThinking = on;
  sendBtn.disabled = on;
  if (on) {
    const el = document.createElement('div');
    el.className = 'thinking';
    el.id = 'thinking-indicator';
    el.textContent = 'Claude is thinking';
    chatArea.appendChild(el);
    chatArea.scrollTop = chatArea.scrollHeight;
  } else {
    const el = document.getElementById('thinking-indicator');
    if (el) el.remove();
  }
}

// ── Chat send ───────────────────────────────────────────────────
async function sendChat() {
  const message = chatInput.value.trim();
  if (!message || isThinking) return;

  addMessage(message, 'user');
  chatInput.value = '';
  chatInput.style.height = 'auto';
  setThinking(true);

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId }),
    });

    if (!resp.ok) {
      addMessage(await resp.text(), 'error');
      setThinking(false);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }

        switch (event.type) {
          case 'text':
            setThinking(false);
            sessionId = event.session_id;
            addMessage(event.content, 'assistant');
            break;

          case 'script':
            codeContent.textContent = event.content;
            break;

          case 'stl': {
            const binary = Uint8Array.from(atob(event.content), c => c.charCodeAt(0));
            loadSTL(binary.buffer);
            break;
          }

          case 'clear':
            clearScene();
            break;

          case 'error':
            setThinking(false);
            addMessage(event.content, 'error');
            break;

          case 'done':
            setThinking(false);
            break;
        }
      }
    }
  } catch (e) {
    setThinking(false);
    addMessage(`Network error: ${e.message}`, 'error');
  }
}

sendBtn.addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});

// Auto-resize textarea
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// ── Run button (manual execution) ───────────────────────────────
runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  runBtn.textContent = 'Running...';
  try {
    const resp = await fetch('/run', { method: 'POST', body: codeContent.textContent });
    if (resp.status === 204) { clearScene(); return; }
    if (!resp.ok) {
      addMessage(await resp.text(), 'error');
      return;
    }
    const buf = await resp.arrayBuffer();
    loadSTL(buf);
  } catch (e) {
    addMessage(e.message, 'error');
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = 'Run';
  }
});
</script>
</body>
</html>
